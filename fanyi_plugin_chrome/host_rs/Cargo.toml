[package]
name = "oc-translate-host"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the oc-translate Chrome native messaging host."
license = "Apache-2.0"
readme = "README.md"
publish = false
autobins = false

[[bin]]
name = "oc-translate-host"
path = "src/main.rs"

[[bin]]
name = "fake-opencode"
path = "src/bin/fake-opencode.rs"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
